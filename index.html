<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta property="og:title" content="Nitin's Board Game Night Menu">
		<meta property="og:description" content="A curated selection of board games for every group size and vibe. Find your perfect game night match!">
		<meta property="og:image" content="https://github.com/ntngupta3515/boardgame/blob/main/resources/ShareImage.png">
		<meta property="og:url" content="https://ntngupta3515.github.io/">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles/base.css">
		<link rel="stylesheet" id="theme">
  	</head>

	<body>

		<canvas id="grid"></canvas>

		<div id="splash" class="splash">
			<h1>🎲 Welcome to Game Night! 🎲</h1>
			<p>How many players at your table?</p>
			<div class="splash-controls">
				<select id="splash-select" aria-label="Number of players"></select>
				<button class="splash-button" onclick="startMenu()">Let's Play!</button>
			</div>
		</div>
		
		<div id="main" style="display: none;">
			<div class="toolbar">
				<div class="tag-filter">
					<div class="active-tags" id="active-tags"></div>
					<select id="tag-filter" aria-label="Filter by tag"></select>
				</div>

				<div class="player-filter">
					<select id="player-filter" aria-label="Number of players"></select>
				</div>
				<button class="theme-switcher" onclick="toggleTheme()"></button>
			</div>
		    <div id="app"></div>
		</div>
    
		<script src="scripts/grid.js"></script>
		<script src="scripts/constants.js"></script>
		<script src="scripts/themeSelector.js"></script>
		<script src="scripts/start.js"></script>
		<script src="scripts/games.js"></script>
		<script src="scripts/filter.js"></script>
		<script src="scripts/app.js"></script>

	</body>

</html>
